name: build

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: "23.2.8568313"
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 NDK/cmake
        run: |
          set -eux
          # runner 自带 Android SDK 与 platform 33/34
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-33" \
            "build-tools;34.0.0" \
            "ndk;${NDK_VERSION}" \
            "cmake;3.22.1"

      # dropbear NDK static-pie 版在 Android 7 段错误，用 musl 重编为非 PIE 静态
      - name: 重编 dropbear (musl 非PIE静态)
        run: bash scripts/build-dropbear-musl.sh

      # fish 无预编译 ARM32 版本，musl 交叉编译静态版
      - name: 编译 fish shell (musl 静态 ARM32)
        run: bash scripts/build-fish-musl.sh

      - name: 签名配置
        run: |
          set -eux
          mkdir -p dist
          if [ -n "${{ secrets.KEYSTORE_B64 }}" ] && [ -n "${{ secrets.KEYSTORE_PASS }}" ]; then
            echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > /tmp/release.keystore
            STORE_PASS="${{ secrets.KEYSTORE_PASS }}"
            echo "使用持久化签名密钥"
          else
            STORE_PASS="anotherterm-ci-2026"
            keytool -genkeypair -v \
              -keystore /tmp/release.keystore \
              -alias anotherterm \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$STORE_PASS" -keypass "$STORE_PASS" \
              -dname "CN=AnotherTerm Tools, OU=Tools, O=AnotherTerm, L=Unknown, ST=Unknown, C=CN"
            echo "使用 CI 临时签名密钥"
          fi
          {
            echo "store.file=/tmp/release.keystore"
            echo "store.password=$STORE_PASS"
            echo "key.alias=anotherterm"
            echo "key.password=$STORE_PASS"
          } > /tmp/signing.properties
          cp /tmp/release.keystore dist/release.keystore
          cp /tmp/signing.properties dist/signing.properties

      # targetSdk 28 + 侧载扩展权限，最适合 Android 4.4
      - name: 构建 oldgoodDowngradableRelease
        run: |
          set -eux
          ./gradlew :app:assembleOldgoodDowngradableRelease \
            -Psigning.properties=/tmp/signing.properties

      - name: 组装发布目录
        run: |
          set -eux
          cp app/build/outputs/apk/oldgood/downgradable/release/*.apk dist/
          ls -la dist/

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: anotherterm-tools-release
          path: dist/
